<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love 💕</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-image: url(background.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .window{
            background-color: rgba(255, 255, 255, 0.2);
            padding: 30px;
            backdrop-filter: blur(3px);
            border-right: 1px solid rgba(255, 255, 255, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            box-shadow: -10px -15px 40px rgba(0, 0, 0, 0.7);
            height: 300px;
            width: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.5s;
        }
        .window:hover{
            transition: 0.5s;
            transform: scale(1.15);
            backdrop-filter: blur(5px);
        }
        .heart{
            text-align: center;
            font-size: 230px;
            color: rgb(200, 0, 0);
            transition: 0.5s;
            position: relative;
            text-shadow: 0 0 20px black;
        }
        .heart:hover{
            transition: 0.5s;
            -webkit-text-stroke: 2px rgba(0, 0, 0);
            transform: scale(0.75);
            text-shadow: none;
        }
        .iza{
            position: absolute;
            z-index: 10;
            top: auto;
            left: auto;
            font-family: 'Times New Roman', Times, serif;
            font-size: 30px;
            font-style: italic;
            font-weight: bold;
            visibility: hidden;
        }
        .window:hover .iza{
            visibility: visible;
            transition: 0.5s;
        }
    </style>
</head>
<body>
    <div class="window" id="window">
        <div class="heart" id="heart" onclick="start()">❤</div>
        <div class="iza" id="iza">Izunia</div>
    </div>
    
</body>
</html>

<script>
    function start(){
        const window = document.getElementById("window");
        window.style.borderRadius = "50px";
        window.style.width = "fit-content";
        window.style.height = "fit-content";
        window.innerHTML = "";
        function typeWriter(elementId, text, speed = 100) {
            const el = document.getElementById(elementId);
            let i = 0;

            function type() {
              if (i < text.length) {
                el.innerHTML += text.charAt(i);
                i++;
                setTimeout(type, speed);
              }
            }

          type();
        }

        // Wywołanie funkcji
        typeWriter("window", "Kocham Cię ❤️", 180);

        window.style.fontSize = "80px";
        window.style.fontStyle = "italic";
        window.style.fontWeight = "bold";
    }
</script>
